<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토요일 근무 스케줄 생성기</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .top-header h1 { color: var(--text-main); margin: 0; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .grid-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
        @media (max-width: 868px) { .grid-layout { grid-template-columns: 1fr; } }

        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 20px; border: 1px solid var(--border); }
        .card h2 { font-size: 1rem; font-weight: 700; margin: 0 0 16px 0; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }

        .form-group { margin-bottom: 14px; }
        .form-row { display: flex; gap: 8px; }

        label { display: block; font-size: 0.825rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%; padding: 9px 12px; box-sizing: border-box; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.875rem; color: var(--text-main); background-color: #fff;
        }

        .btn { background-color: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.875rem; width: 100%; }
        .btn:hover { background-color: var(--primary-hover); }

        .btn-danger { background-color: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        .btn-outline { background: #ffffff; color: var(--text-main); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }

        .item-list { list-style: none; padding: 0; margin: 0; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; background: #fff; }
        .member-num { font-weight: 700; color: var(--primary); margin-right: 6px; }
        .tag { font-size: 0.725rem; padding: 2px 6px; border-radius: 4px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); margin-left: 6px; font-weight: 600; }

        table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; font-size: 0.875rem; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        th, td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 10px 12px; text-align: center; vertical-align: middle; }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; font-size: 0.8rem; }

        .holiday-row { background-color: #fef2f2; color: #dc2626; font-weight: 600; }
        mark { background-color: #fef08a; color: #854d0e; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .filter-container { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; }
        .filter-container select { width: auto; padding: 6px 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <h1>📆 토요일 근무 스케줄 생성기 (관리자용)</h1>
        <button class="btn btn-outline" style="width:auto; padding: 8px 14px;" onclick="location.reload();">🔄 새로고침</button> 
    </div>

    <div class="grid-layout">
        <div class="sidebar">
            <div class="card">
                <h2>1. 연도 설정</h2>
                <div class="form-group" style="margin-bottom:0;">
                    <label for="yearSelect">대상 연도</label>
                    <input type="number" id="yearSelect" value="2027" min="2024" max="2035" onchange="updateTableTitle()">
                </div>
            </div>

            <div class="card">
                <h2>2. 휴일 추가</h2>
                <div class="form-group form-row">
                    <input type="text" id="customHolidayName" placeholder="휴일명 (예: 개원기념일)">
                    <input type="date" id="customHolidayDate">
                </div>
                <button class="btn btn-outline" onclick="addCustomHoliday()">+ 휴일 추가</button>
                <ul class="item-list" id="customHolidayListUI" style="margin-top: 10px;"></ul>
            </div>

            <div class="card">
                <h2>3. 근무 인원 설정 <span id="memberTotalCount" style="font-size:0.8rem; color:var(--primary);">(총 9명)</span></h2>
                <div class="form-group form-row">
                    <input type="text" id="memberName" placeholder="이름 입력" style="flex:1;">
                    <select id="memberRole" style="width: 110px;">
                        <option value="ALL">전체가능</option>
                        <option value="폐">폐 전담</option>
                        <option value="특">특 전담</option>
                    </select>
                </div>
                <button class="btn btn-outline" onclick="addMember()">+ 인원 추가</button>
                <ul class="item-list" id="memberListUI" style="margin-top: 10px;"></ul>
            </div>

            <div class="card">
                <h2>4. 동시 근무 금지</h2>
                <div class="form-group">
                    <label>같은 날 함께 근무하지 않을 조합 선택</label>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <select id="banPerson1"></select>
                        <span style="color:var(--text-muted);">✕</span>
                        <select id="banPerson2"></select>
                    </div>
                </div>
                <button class="btn btn-outline" onclick="addBannedPair()">+ 금지조합 추가</button>
                <ul class="item-list" id="bannedListUI" style="margin-top: 10px;"></ul>
            </div>

            <button class="btn" style="font-size: 1rem; padding: 14px; margin-bottom: 10px;" onclick="generateSchedule()">✨ 스케줄 생성하기</button>
            <button class="btn btn-outline" style="font-size: 0.9rem; padding: 12px; background-color: var(--primary-light); color: var(--primary); border-color: #bfdbfe; margin-bottom: 20px;" onclick="downloadUserHtml()">💾 사용자용 HTML 다운로드</button>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>📊 근무 통계 요약</h2>
                <div id="statsUI" style="overflow-x: auto;">스케줄을 생성하면 개인별 통계가 표시됩니다.</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 id="tableTitle">📋 상세 근무표 (2027년)</h2>
                    <div class="filter-container">
                        <label for="filterMember" style="margin:0;">👤 조회:</label>
                        <select id="filterMember" onchange="filterSchedule()">
                            <option value="ALL">전체 보기</option>
                        </select>
                    </div>
                </div>

                <div style="overflow-x: auto;">
                    <table id="scheduleTable">
                        <thead>
                            <tr>
                                <th>날짜 (요일)</th>
                                <th>특검</th>
                                <th>폐알혈</th>
                                <th>비고</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" style="color: var(--text-muted); padding: 24px;">왼쪽의 <b>[스케줄 생성하기]</b> 버튼을 눌러주세요.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwuPjha_MWe-rVIqJYdWZA3gasmM1Yn7pyvDCn2D_I_eDr38YBJC7BEMgk0K9mShPEx/exec";

    let members = [
        { name: '지영', role: 'ALL' }, { name: '한오', role: 'ALL' },
        { name: '보연', role: 'ALL' }, { name: '혜진', role: 'ALL' },
        { name: '현지', role: 'ALL' }, { name: '소현', role: 'ALL' }, 
        { name: '미선', role: '폐' }, { name: '미정', role: 'ALL' }, 
        { name: '해림', role: 'ALL' }
    ];

    let bannedPairs = [];
    let customHolidays = [{ name: '개원기념일', date: '2027-10-15' }];
    let scheduleData = [];
    let finalWorkCount = {};

    function formatDate(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function formatShortDate(d) {
        return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function sortMembersByName() {
        members.sort((a, b) => a.name.localeCompare(b.name, 'ko-KR'));
    }

    function updateTableTitle() {
        var year = document.getElementById('yearSelect').value;
        document.getElementById('tableTitle').innerText = '📋 상세 근무표 (' + year + '년)';
    }

    window.onload = function() {
        sortMembersByName();
        renderMembers();
        renderBannedPairs();
        renderCustomHolidays();
        updateSelectOptions();
        updateTableTitle();
    };

    function renderCustomHolidays() {
        var listUI = document.getElementById('customHolidayListUI');
        listUI.innerHTML = '';
        customHolidays.forEach((h, idx) => {
            var li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = '<span>🎉 <b>' + h.name + '</b> (' + h.date + ')</span><button class="btn-danger" onclick="removeCustomHoliday(' + idx + ')">삭제</button>';
            listUI.appendChild(li);
        });
    }

    function addCustomHoliday() {
        var name = document.getElementById('customHolidayName').value.trim();
        var date = document.getElementById('customHolidayDate').value;
        if(!name || !date) return alert('휴일 명칭과 날짜를 입력해주세요.');
        customHolidays.push({ name, date });
        renderCustomHolidays();
    }

    function removeCustomHoliday(idx) {
        customHolidays.splice(idx, 1);
        renderCustomHolidays();
    }

    function renderMembers() {
        sortMembersByName();
        var listUI = document.getElementById('memberListUI');
        listUI.innerHTML = '';
        document.getElementById('memberTotalCount').innerText = '(총 ' + members.length + '명)';
        members.forEach((m, idx) => {
            var li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = '<div><span class="member-num">' + (idx + 1) + '.</span><b>' + m.name + '</b> <span class="tag">' + m.role + '</span></div><button class="btn-danger" onclick="removeMember(' + idx + ')">삭제</button>';
            listUI.appendChild(li);
        });
        updateSelectOptions();
    }

    function addMember() {
        var nameInput = document.getElementById('memberName');
        var roleSelect = document.getElementById('memberRole');
        var name = nameInput.value.trim();
        if(!name) return alert('이름을 입력해주세요.');
        if(members.some(m => m.name === name)) return alert('이미 존재하는 이름입니다.');
        members.push({ name: name, role: roleSelect.value });
        nameInput.value = '';
        renderMembers();
    }

    function removeMember(idx) {
        var removedName = members[idx].name;
        members.splice(idx, 1);
        bannedPairs = bannedPairs.filter(p => p[0] !== removedName && p[1] !== removedName);
        renderMembers();
        renderBannedPairs();
    }

    function updateSelectOptions() {
        var b1 = document.getElementById('banPerson1');
        var b2 = document.getElementById('banPerson2');
        var filterSelect = document.getElementById('filterMember');
        if(!b1 || !b2 || !filterSelect) return;
        b1.innerHTML = ''; b2.innerHTML = '';
        filterSelect.innerHTML = '<option value="ALL">전체 보기</option>';
        members.forEach((m, idx) => {
            var opt = '<option value="' + m.name + '">' + (idx + 1) + '. ' + m.name + '</option>';
            b1.innerHTML += opt; b2.innerHTML += opt; filterSelect.innerHTML += opt;
        });
    }

    function renderBannedPairs() {
        var listUI = document.getElementById('bannedListUI');
        listUI.innerHTML = '';
        bannedPairs.forEach((pair, idx) => {
            var li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = '<span>🚫 <b>' + pair[0] + '</b> ✕ <b>' + pair[1] + '</b></span><button class="btn-danger" onclick="removeBannedPair(' + idx + ')">삭제</button>';
            listUI.appendChild(li);
        });
    }

    function addBannedPair() {
        var p1 = document.getElementById('banPerson1').value;
        var p2 = document.getElementById('banPerson2').value;
        if(p1 === p2) return alert('다른 사람을 선택해주세요.');
        bannedPairs.push([p1, p2].sort());
        renderBannedPairs();
    }

    function removeBannedPair(idx) {
        bannedPairs.splice(idx, 1);
        renderBannedPairs();
    }

    function getHolidaysWithSubstitutes(year) {
        var holidays = {};
        function toStr(y, m, d) { return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }

        function addHoliday(dateStr, name, canHaveSubstitute = true) {
            if (!holidays[dateStr]) holidays[dateStr] = name;
            if (canHaveSubstitute) {
                var d = new Date(dateStr);
                var dayOfWeek = d.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    var subDate = new Date(d);
                    do { subDate.setDate(subDate.getDate() + 1); } 
                    while (subDate.getDay() === 0 || subDate.getDay() === 6 || holidays[toStr(subDate.getFullYear(), subDate.getMonth() + 1, subDate.getDate())]);
                    holidays[toStr(subDate.getFullYear(), subDate.getMonth() + 1, subDate.getDate())] = '대체공휴일(' + name + ')';
                }
            }
        }

        addHoliday(year + '-01-01', '신정', false);
        addHoliday(year + '-03-01', '삼일절', true);
        addHoliday(year + '-05-01', '근로자의 날', false);
        addHoliday(year + '-05-05', '어린이날', true);
        addHoliday(year + '-06-06', '현충일', false);
        addHoliday(year + '-07-17', '제헌절', true);
        addHoliday(year + '-08-15', '광복절', true);
        addHoliday(year + '-10-03', '개천절', true);
        addHoliday(year + '-10-09', '한글날', true);
        addHoliday(year + '-12-25', '크리스마스', true);

        if (year === 2026) {
            addHoliday('2026-02-16', '설날 연휴'); addHoliday('2026-02-17', '설날'); addHoliday('2026-02-18', '설날 연휴');
            addHoliday('2026-05-24', '부처님오신날', true);
            addHoliday('2026-09-24', '추석 연휴'); addHoliday('2026-09-25', '추석'); addHoliday('2026-09-26', '추석 연휴');
        } else if (year === 2027) {
            addHoliday('2027-02-06', '설날 연휴'); addHoliday('2027-02-07', '설날'); addHoliday('2027-02-08', '설날 연휴');
            addHoliday('2027-05-13', '부처님오신날', true);
            addHoliday('2027-09-14', '추석 연휴'); addHoliday('2027-09-15', '추석'); addHoliday('2027-09-16', '추석 연휴');
            addHoliday('2027-02-09', '대체공휴일(설날)', false);
            addHoliday('2027-10-04', '대체공휴일(개천절)', false);
        }

        customHolidays.forEach(ch => addHoliday(ch.date, ch.name, false));
        return holidays;
    }

    function generateSchedule() {
        var year = parseInt(document.getElementById('yearSelect').value);
        if(members.length < 2) return alert('최소 2명 이상의 인원이 필요합니다.');

        updateTableTitle();
        sortMembersByName();

        var date = new Date(year, 0, 1);
        var saturdays = [];
        while (date.getFullYear() === year) {
            if (date.getDay() === 6) saturdays.push(new Date(date));
            date.setDate(date.getDate() + 1);
        }

        var holidayMap = getHolidaysWithSubstitutes(year);
        var bannedSet = new Set();
        if (typeof bannedPairs !== 'undefined') bannedPairs.forEach(p => bannedSet.add(p.sort().join('&')));

        var totalWorkingSaturdays = saturdays.filter(sat => !holidayMap[formatDate(sat)]).length;
        var totalShiftSlots = totalWorkingSaturdays * 2; 

        var dedicatedCount = members.filter(m => m.role === '폐' || m.role === '특').length;
        var allCount = members.filter(m => m.role === 'ALL').length;

        var avgAllWorkerDays = totalShiftSlots / (allCount + (dedicatedCount * 0.5));
        var dedicatedTargetDays = Math.ceil(avgAllWorkerDays / 2);

        finalWorkCount = {};
        members.forEach(m => finalWorkCount[m.name] = { total: 0, tuk: 0, pye: 0, sandwich: 0 });

        var monthlyWorkCount = {};
        for(var m = 0; m < 12; m++) {
            monthlyWorkCount[m] = {};
            members.forEach(mem => monthlyWorkCount[m][mem.name] = 0);
        }

        var pairHistory = {};
        for(var i = 0; i < members.length; i++) {
            for(var j = i + 1; j < members.length; j++) {
                pairHistory[[members[i].name, members[j].name].sort().join('&')] = 0;
            }
        }

        var recent3WeeksHistory = [];
        var lastSandwichWorkers = [];
        scheduleData = [];
        var weekNames = ['일', '월', '화', '수', '목', '금', '토'];

        saturdays.forEach((satDate, idx) => {
            var dateStr = formatDate(satDate);
            var shortDateStr = formatShortDate(satDate);
            var dayName = weekNames[satDate.getDay()];
            var displayDate = shortDateStr + ' (' + dayName + ')';
            var isHoliday = !!holidayMap[dateStr];
            var currentMonth = satDate.getMonth();

            if(isHoliday) {
                scheduleData.push({ id: idx, displayDate, isHoliday: true, holidayName: holidayMap[dateStr], tukWorker: '', pyeWorker: '', isSandwich: false });
                recent3WeeksHistory.push([]);
                if(recent3WeeksHistory.length > 3) recent3WeeksHistory.shift();
            } else {
                var isSandwich = false;
                var checkOffsets = [-2, -1, 2, 3];
                for(var offset of checkOffsets) {
                    var checkDate = new Date(satDate);
                    checkDate.setDate(checkDate.getDate() + offset);
                    if(checkDate.getDay() !== 0 && holidayMap[formatDate(checkDate)]) {
                        isSandwich = true;
                        break;
                    }
                }

                var recent3WeeksWorkers = recent3WeeksHistory.flat();

                function findBestPair(strictRestInterval, allowSandwichRelax, allowOverPenalty) {
                    var best = null;
                    var minScore = Infinity;

                    var indicesI = [...Array(members.length).keys()].sort(() => Math.random() - 0.5);
                    var indicesJ = [...Array(members.length).keys()].sort(() => Math.random() - 0.5);

                    for (var i of indicesI) {
                        for (var j of indicesJ) {
                            if (i === j) continue;
                            var candTuk = members[i];
                            var candPye = members[j];

                            if (candTuk.role === '폐' || candPye.role === '특') continue;

                            var pairKey = [candTuk.name, candPye.name].sort().join('&');
                            if (bannedSet.has(pairKey)) continue;

                            if (strictRestInterval && (recent3WeeksWorkers.includes(candTuk.name) || recent3WeeksWorkers.includes(candPye.name))) continue;

                            if (isSandwich && !allowSandwichRelax) {
                                var isTukDedicated = candTuk.role === '특' || candTuk.role === '폐';
                                var isPyeDedicated = candPye.role === '특' || candPye.role === '폐';

                                if (isTukDedicated && finalWorkCount[candTuk.name].sandwich >= 1) continue;
                                if (isPyeDedicated && finalWorkCount[candPye.name].sandwich >= 1) continue;
                                if (finalWorkCount[candTuk.name].sandwich >= 2 || finalWorkCount[candPye.name].sandwich >= 2) continue;
                            }

                            var targetTuk = (candTuk.role === '폐' || candTuk.role === '특') ? dedicatedTargetDays : avgAllWorkerDays;
                            var targetPye = (candPye.role === '폐' || candPye.role === '특') ? dedicatedTargetDays : avgAllWorkerDays;

                            var tukOverPenalty = (!allowOverPenalty && finalWorkCount[candTuk.name].total >= targetTuk) ? 1000000 : 0;
                            var pyeOverPenalty = (!allowOverPenalty && finalWorkCount[candPye.name].total >= targetPye) ? 1000000 : 0;

                            var ratioTuk = finalWorkCount[candTuk.name].total / (targetTuk || 1);
                            var ratioPye = finalWorkCount[candPye.name].total / (targetPye || 1);

                            var scoreTuk = Math.pow(ratioTuk * 10, 3) * 10000 + (finalWorkCount[candTuk.name].tuk * 100) + (isSandwich ? finalWorkCount[candTuk.name].sandwich * 5000 : 0) + tukOverPenalty;
                            var scorePye = Math.pow(ratioPye * 10, 3) * 10000 + (finalWorkCount[candPye.name].pye * 100) + (isSandwich ? finalWorkCount[candPye.name].sandwich * 5000 : 0) + pyeOverPenalty;
                            
                            var fairnessScore = scoreTuk + scorePye;
                            var thisMonthTukCount = monthlyWorkCount[currentMonth][candTuk.name] || 0;
                            var thisMonthPyeCount = monthlyWorkCount[currentMonth][candPye.name] || 0;
                            var monthlyPenalty = (Math.pow(thisMonthTukCount, 2) + Math.pow(thisMonthPyeCount, 2)) * 80000;
                            var sandwichPenalty = (isSandwich && (lastSandwichWorkers.includes(candTuk.name) || lastSandwichWorkers.includes(candPye.name))) ? 50000 : 0;

                            var totalScore = fairnessScore + monthlyPenalty + sandwichPenalty + ((pairHistory[pairKey] || 0) * 100);

                            if (totalScore < minScore) {
                                minScore = totalScore;
                                best = { tukWorker: candTuk.name, pyeWorker: candPye.name, isSandwich };
                            }
                        }
                    }
                    return best;
                }

                var bestOption = findBestPair(true, false, false) 
                              || findBestPair(false, false, false) 
                              || findBestPair(false, true, true);

                if (!bestOption) return alert(displayDate + ' 날짜는 절대 규칙(동시근무 금지 등)으로 인해 배치 가능한 인원이 없습니다.');

                var tuk = bestOption.tukWorker;
                var pye = bestOption.pyeWorker;

                finalWorkCount[tuk].total++; finalWorkCount[tuk].tuk++;
                finalWorkCount[pye].total++; finalWorkCount[pye].pye++;
                
                monthlyWorkCount[currentMonth][tuk]++;
                monthlyWorkCount[currentMonth][pye]++;

                if(isSandwich) {
                    finalWorkCount[tuk].sandwich++; finalWorkCount[pye].sandwich++;
                    lastSandwichWorkers = [tuk, pye];
                }

                pairHistory[[tuk, pye].sort().join('&')] = (pairHistory[[tuk, pye].sort().join('&')] || 0) + 1;
                recent3WeeksHistory.push([tuk, pye]);
                if(recent3WeeksHistory.length > 3) recent3WeeksHistory.shift();

                scheduleData.push({ id: idx, displayDate, isHoliday: false, holidayName: '', tukWorker: tuk, pyeWorker: pye, isSandwich });
            }
        });

        renderStats();
        filterSchedule();
        uploadScheduleToGoogleSheet();
    }

    function uploadScheduleToGoogleSheet() {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
            alert("스케줄이 생성되었습니다.");
            return;
        }

        if (!confirm("생성된 스케줄을 구글 시트로 자동 전송하시겠습니까?")) return;

        var payload = { action: "saveAll", scheduleData: scheduleData };

        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") alert("✅ 구글 시트에 성공적으로 저장되었습니다!");
            else alert("구글 시트 저장 실패");
        })
        .catch(err => alert("구글 시트 전송 중 오류가 발생했습니다."));
    }

    function renderStats() {
        var statsHTML = '<table><thead><tr><th>이름</th><th>총 근무</th><th>특검</th><th>폐알혈</th><th>샌드위치</th></tr></thead><tbody>';
        members.forEach((m) => {
            var stat = finalWorkCount[m.name] || { total: 0, tuk: 0, pye: 0, sandwich: 0 };
            statsHTML += '<tr><td><b>' + m.name + '</b></td><td><span style="color:var(--primary); font-weight:bold;">' + stat.total + '회</span></td><td>' + stat.tuk + '회</td><td>' + stat.pye + '회</td><td>' + stat.sandwich + '회</span></td></tr>';
        });
        statsHTML += '</tbody></table>';
        document.getElementById('statsUI').innerHTML = statsHTML;
    }

    function filterSchedule() {
        var selectedName = document.getElementById('filterMember').value;
        var tbody = document.querySelector('#scheduleTable tbody');
        tbody.innerHTML = '';

        if(scheduleData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted); padding: 24px;">왼쪽의 <b>[스케줄 생성하기]</b> 버튼을 눌러주세요.</td></tr>';
            return;
        }

        var filteredList = selectedName === 'ALL' ? scheduleData : scheduleData.filter(item => !item.isHoliday && (item.tukWorker === selectedName || item.pyeWorker === selectedName));

        filteredList.forEach(item => {
            var tr = document.createElement('tr');
            if(item.isHoliday) {
                tr.className = 'holiday-row';
                tr.innerHTML = '<td>' + item.displayDate + '</td><td colspan="2">' + item.holidayName + '</td><td>휴무</td>';
            } else {
                var tukName = item.tukWorker === selectedName ? '<mark>' + item.tukWorker + '</mark>' : item.tukWorker;
                var pyeName = item.pyeWorker === selectedName ? '<mark>' + item.pyeWorker + '</mark>' : item.pyeWorker;
                var noteParts = [];
                if (item.isSandwich) noteParts.push('🥪');
                if (item.tukSwapInfo || item.pyeSwapInfo) {
                    var swaps = [];
                    if(item.tukSwapInfo) swaps.push(item.tukSwapInfo);
                    if(item.pyeSwapInfo) swaps.push(item.pyeSwapInfo);
                    noteParts.push(swaps.join(' / '));
                }
                var noteStr = noteParts.length > 0 ? noteParts.join(' ') : '-';
                tr.innerHTML = '<td>' + item.displayDate + '</td><td><b>' + tukName + '</b></td><td><b>' + pyeName + '</b></td><td>' + noteStr + '</td>';
            }
            tbody.appendChild(tr);
        });
    }

        var safeHolidayMap = JSON.stringify(holidayMap).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        var userHtml = `<!DOCTYPE html>

<script>
var GAS_WEB_APP_URL = "${GAS_WEB_APP_URL}";
var targetYear = ${year};
var currentMonth = 0;
var originalScheduleData = JSON.parse('${safeScheduleData}');
var tempScheduleData = [];
var members = JSON.parse('${safeMembers}');
var holidayMap = JSON.parse('${safeHolidayMap}');
var userStats = {};

window.onload = function() {
    initMemberSelects();
    if(originalScheduleData && originalScheduleData.length > 0) {
        tempScheduleData = JSON.parse(JSON.stringify(originalScheduleData));
        refreshAllUI();
        initSwapDateOptions();
    } else {
        fetchDataFromGoogleSheet();
    }
};

function openInfoModal() {
    var modal = document.getElementById('infoModal');
    if (modal) modal.style.display = 'flex';
}

function closeInfoModal() {
    var modal = document.getElementById('infoModal');
    if (modal) modal.style.display = 'none';
}

window.addEventListener('click', function(event) {
    var modal = document.getElementById('infoModal');
    if (event.target === modal) {
        closeInfoModal();
    }
});

function initMemberSelects() {
    var selFilter = document.getElementById("userFilter");
    var selTarget = document.getElementById("singleTargetMember");
    var selFrom = document.getElementById("swapFromMember");
    var selTo = document.getElementById("swapToMember");

    if (selFilter) selFilter.innerHTML = '<option value="ALL">전체 보기</option>';
    if (selTarget) selTarget.innerHTML = '';
    if (selFrom) selFrom.innerHTML = '';
    if (selTo) selTo.innerHTML = '';

    members.forEach(function(m){
        if (selFilter) { var opt1 = document.createElement("option"); opt1.value = m.name; opt1.innerText = m.name; selFilter.appendChild(opt1); }
        if (selTarget) { var opt2 = document.createElement("option"); opt2.value = m.name; opt2.innerText = m.name; selTarget.appendChild(opt2); }
        if (selFrom) { var opt3 = document.createElement("option"); opt3.value = m.name; opt3.innerText = m.name; selFrom.appendChild(opt3); }
        if (selTo) { var opt4 = document.createElement("option"); opt4.value = m.name; opt4.innerText = m.name; selTo.appendChild(opt4); }
    });
}

function switchSubTab(mode) {
    document.getElementById("subTabDate").classList.toggle("active", mode === 'date');
    document.getElementById("subTabAll").classList.toggle("active", mode === 'all');
    document.getElementById("swapDateMode").style.display = mode === 'date' ? "block" : "none";
    document.getElementById("swapAllMode").style.display = mode === 'all' ? "block" : "none";
}

function applyTempSwapSingle() {
    var dateSelect = document.getElementById("swapDateSelect");
    var roleSelect = document.getElementById("swapRoleSelect");
    var newWorkerSelect = document.getElementById("singleTargetMember");

    if (!dateSelect || !dateSelect.value) return alert("변경할 날짜를 선택해 주세요.");

    var selectedDate = dateSelect.value;
    var role = roleSelect.value;
    var newWorker = newWorkerSelect.value;

    var item = tempScheduleData.find(function(i){ return i.displayDate === selectedDate; });
    if (!item || item.isHoliday) return alert("해당 날짜는 근무일이 아닙니다.");

    var currentWorker = (role === 'tuk') ? item.tukWorker : item.pyeWorker;
    if (currentWorker === newWorker) return alert("기존 근무자와 변경할 인원이 같습니다.");

    var targetMem = members.find(function(m){ return m.name === newWorker; });
    if (!targetMem) return;

    if (role === 'tuk' && targetMem.role === '폐') return alert(newWorker + " 님은 [폐 전담]이라 특검 근무에 들어갈 수 없습니다.");
    if (role === 'pye' && targetMem.role === '특') return alert(newWorker + " 님은 [특 전담]이라 폐알혈 근무에 들어갈 수 없습니다.");

    if (role === 'tuk' && item.pyeWorker === newWorker) return alert(newWorker + " 님이 이미 해당 날짜의 폐알혈 근무자로 지정되어 있습니다.");
    if (role === 'pye' && item.tukWorker === newWorker) return alert(newWorker + " 님이 이미 해당 날짜의 특검 근무자로 지정되어 있습니다.");

    var swapInfoStr = currentWorker + " → " + newWorker;
    if (role === 'tuk') {
        item.tukWorker = newWorker;
        item.tukSwapInfo = swapInfoStr;
    } else {
        item.pyeWorker = newWorker;
        item.pyeSwapInfo = swapInfoStr;
    }
    item.isModified = true;

    refreshAllUI();
    alert(selectedDate + " 근무가 임시 수정되었습니다.\\n마지막에 하단의 [💾 변경사항 저장] 버튼을 누르면 서버에 일괄 저장됩니다.");
}

function applyTempSwapAll() {
    var fromMember = document.getElementById("swapFromMember").value;
    var toMember = document.getElementById("swapToMember").value;

    if (!fromMember || !toMember) return alert("변경할 대상을 모두 선택해 주세요.");
    if (fromMember === toMember) return alert("서로 다른 인원을 선택해 주세요.");

    var changedCount = 0;
    tempScheduleData.forEach(function(item) {
        if (!item.isHoliday) {
            var isItemChanged = false;
            if (item.tukWorker === fromMember) { item.tukWorker = toMember; item.tukSwapInfo = fromMember + " → " + toMember; isItemChanged = true; }
            if (item.pyeWorker === fromMember) { item.pyeWorker = toMember; item.pyeSwapInfo = fromMember + " → " + toMember; isItemChanged = true; }
            if (isItemChanged) { item.isModified = true; changedCount++; }
        }
    });

    if (changedCount === 0) return alert("[" + fromMember + "] 님의 예정된 근무를 찾을 수 없습니다.");

    refreshAllUI();
    alert("[" + fromMember + "] ➔ [" + toMember + "] 총 " + changedCount + "건의 근무가 임시 수정되었습니다.\\n[💾 변경사항 저장] 버튼을 눌러 적용을 완료해주세요.");
}

function saveAllChangesToServer() {
    var modifiedItems = tempScheduleData.filter(function(i){ return i.isModified; });
    if (modifiedItems.length === 0) return alert("수정된 내역이 없습니다.");

    if (!confirm("총 " + modifiedItems.length + "건의 수정사항을 서버(구글 시트)에 저장 및 공유하시겠습니까?")) return;

    tempScheduleData.forEach(function(i){ delete i.isModified; });
    originalScheduleData = JSON.parse(JSON.stringify(tempScheduleData));

    if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "saveAll", scheduleData: originalScheduleData })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            alert("✅ 서버에 성공적으로 저장되었습니다!");
            refreshAllUI();
        })
        .catch(function(err) {
            alert("⚠️ 저장 중 오류가 발생했습니다. 다시 시도해 주세요.");
            console.error(err);
        });
    } else {
        alert("✅ 변경사항이 정상 저장되었습니다!");
        refreshAllUI();
    }
}

function discardAllChanges() {
    var modifiedItems = tempScheduleData.filter(function(i){ return i.isModified; });
    if (modifiedItems.length === 0) return alert("취소할 수정 내역이 없습니다.");

    if (!confirm("저장되지 않은 모든 임시 수정 내역을 취소하고 원래 상태로 되돌리시겠습니까?")) return;

    tempScheduleData = JSON.parse(JSON.stringify(originalScheduleData));
    refreshAllUI();
    alert("모든 임시 수정 사항이 취소되었습니다.");
}

function refreshAllUI() {
    recalcStats();
    renderCalendar();
    renderList();
    initSwapDateOptions();
}

function initSwapDateOptions() {
    var dateSel = document.getElementById("swapDateSelect");
    if (!dateSel) return;
    dateSel.innerHTML = "";
    var workItems = tempScheduleData.filter(function(item){ return !item.isHoliday; });
    workItems.forEach(function(item){
        var opt = document.createElement("option");
        opt.value = item.displayDate;
        opt.innerText = item.displayDate + (item.isModified ? " (수정됨)" : "");
        dateSel.appendChild(opt);
    });
    if(workItems.length > 0) onSwapDateChange();
}

function fetchDataFromGoogleSheet() {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
    fetch(GAS_WEB_APP_URL)
        .then(res => res.json())
        .then(parsedData => {
            if (parsedData && parsedData.length > 0) {
                originalScheduleData = parsedData;
                tempScheduleData = JSON.parse(JSON.stringify(originalScheduleData));
                refreshAllUI();
            }
        })
        .catch(err => console.error("데이터 로드 오류"));
}

function onSwapDateChange() {
    var dateSel = document.getElementById("swapDateSelect");
    var roleSel = document.getElementById("swapRoleSelect");
    if (!dateSel || !roleSel) return;
    var selectedDate = dateSel.value;
    var role = roleSel.value;
    var item = tempScheduleData.find(function(i){ return i.displayDate === selectedDate; });
    if(item) {
        var currentWorker = role === 'tuk' ? item.tukWorker : item.pyeWorker;
        document.getElementById("currentWorkerName").innerText = currentWorker;
    }
}

function switchTab(type) {
    document.getElementById("calView").style.display = type === "cal" ? "block" : "none";
    document.getElementById("listView").style.display = type === "list" ? "block" : "none";
    document.getElementById("tabCal").classList.toggle("active", type === "cal");
    document.getElementById("tabList").classList.toggle("active", type === "list");
}

function onFilterChange() { renderCalendar(); renderList(); }

function changeMonth(delta) {
    currentMonth += delta;
    if(currentMonth < 0) currentMonth = 0;
    if(currentMonth > 11) currentMonth = 11;
    renderCalendar();
}

function renderCalendar() {
    document.getElementById("calMonthTitle").innerText = targetYear + "년 " + (currentMonth + 1) + "월";
    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    days.forEach(function(d){ grid.innerHTML += "<div class='cal-day-header'>" + d + "</div>"; });
    
    var firstDay = new Date(targetYear, currentMonth, 1).getDay();
    var lastDate = new Date(targetYear, currentMonth + 1, 0).getDate();
    var prevLastDate = new Date(targetYear, currentMonth, 0).getDate();
    var selectedMember = document.getElementById("userFilter").value;
    
    var now = new Date();
    var isTodayYear = (targetYear === now.getFullYear() && currentMonth === now.getMonth());

    for(var i = firstDay - 1; i >= 0; i--) {
        grid.innerHTML += "<div class='cal-cell other-month'><span class='cal-date-num'>" + (prevLastDate - i) + "</span></div>";
    }
    
    for(var d = 1; d <= lastDate; d++) {
        var monthStr = String(currentMonth + 1).padStart(2, "0");
        var dayStr = String(d).padStart(2, "0");
        var fullDateKey = targetYear + "-" + monthStr + "-" + dayStr;
        var shortDateKey = monthStr + "-" + dayStr;
        var dayOfWeek = new Date(targetYear, currentMonth, d).getDay();
        
        var cellClass = "cal-cell";
        if(dayOfWeek === 6) cellClass += " sat";
        if(dayOfWeek === 0) cellClass += " sun";
        
        var isToday = (isTodayYear && d === now.getDate());
        if(isToday) cellClass += " today";

        var holidayName = holidayMap[fullDateKey];
        if(holidayName) cellClass += " holiday";
        
        var matchingItem = tempScheduleData.find(function(item){ return item.displayDate.includes(shortDateKey); });
        var badgeHtml = "";
        
        if(holidayName) {
            badgeHtml = "<div class='cal-badge bg-holiday'>" + holidayName + "</div>";
        } else if(matchingItem && !matchingItem.isHoliday) {
            var isSwapped = !!(matchingItem.tukSwapInfo || matchingItem.pyeSwapInfo);
            var isMyWork = (selectedMember !== "ALL" && (matchingItem.tukWorker === selectedMember || matchingItem.pyeWorker === selectedMember));
            
            var badgeStyle = "bg-work-clean";
            if (matchingItem.isModified) badgeStyle = "bg-modified";
            else if (isSwapped) badgeStyle = "bg-swapped";
            else if (isMyWork) badgeStyle = "bg-mywork";
            
          // 연필 아이콘(modTag) 제거
badgeHtml = "<div class='cal-badge " + badgeStyle + "'>" + "특: " + matchingItem.tukWorker + "<br>폐: " + matchingItem.pyeWorker + "</div>";
   }
        
        var todayLabel = isToday ? "<span class='today-badge'>오늘</span>" : "";
        grid.innerHTML += "<div class='" + cellClass + "'>" + todayLabel + "<span class='cal-date-num'>" + d + "</span>" + badgeHtml + "</div>";
    }
    
    var totalCells = firstDay + lastDate;
    var nextDays = (7 - (totalCells % 7)) % 7;
    for(var n = 1; n <= nextDays; n++) {
        grid.innerHTML += "<div class='cal-cell other-month'><span class='cal-date-num'>" + n + "</span></div>";
    }
}

function renderList() {
    var val = document.getElementById("userFilter").value;
    var tbody = document.getElementById("tblBody");
    tbody.innerHTML = "";
    var list = val === "ALL" ? tempScheduleData : tempScheduleData.filter(function(i){ return !i.isHoliday && (i.tukWorker === val || i.pyeWorker === val); });
    
    list.forEach(function(item) {
        var tr = document.createElement("tr");
        if(item.isModified) tr.className = "modified-row";

        if(item.isHoliday) {
            tr.className = "holiday-row";
            tr.innerHTML = "<td>" + item.displayDate + "</td><td colspan='2'>" + item.holidayName + "</td><td>휴무</td>";
        } else {
            var tukStr = item.tukSwapInfo ? "<span class='swapped-name'>" + item.tukWorker + "</span>" : (item.tukWorker === val ? "<mark>" + item.tukWorker + "</mark>" : item.tukWorker);
            var pyeStr = item.pyeSwapInfo ? "<span class='swapped-name'>" + item.pyeWorker + "</span>" : (item.pyeWorker === val ? "<mark>" + item.pyeWorker + "</mark>" : item.pyeWorker);
            
            var noteParts = [];
            if(item.isSandwich) noteParts.push("🥪");
            
            var swaps = [];
            if(item.tukSwapInfo) swaps.push(item.tukSwapInfo);
            if(item.pyeSwapInfo) swaps.push(item.pyeSwapInfo);
            
            if(swaps.length > 0) noteParts.push("<span class='swap-info-badge'>" + swaps.join(" / ") + "</span>");
            if(item.isModified) noteParts.push("<span class='modified-badge'>수정됨</span>");

            var noteStr = noteParts.length > 0 ? noteParts.join(" ") : "-";

            tr.innerHTML = "<td>" + item.displayDate + "</td><td><b>" + tukStr + "</b></td><td><b>" + pyeStr + "</b></td><td>" + noteStr + "</td>";
        }
        tbody.appendChild(tr);
    });
}

function recalcStats() {
    userStats = {};
    members.forEach(function(m){ userStats[m.name] = { total: 0, tuk: 0, pye: 0, sandwich: 0 }; });
    tempScheduleData.forEach(function(item){
        if(!item.isHoliday) {
            if(userStats[item.tukWorker]) { userStats[item.tukWorker].total++; userStats[item.tukWorker].tuk++; if(item.isSandwich) userStats[item.tukWorker].sandwich++; }
            if(userStats[item.pyeWorker]) { userStats[item.pyeWorker].total++; userStats[item.pyeWorker].pye++; if(item.isSandwich) userStats[item.pyeWorker].sandwich++; }
        }
    });
    renderStats();
}

function renderStats() {
    var html = "<table><thead><tr><th>이름</th><th>총 근무</th><th>특검</th><th>폐알혈</th><th>샌드위치</th></tr></thead><tbody>";
    members.forEach(function(m){
        var st = userStats[m.name] || { total: 0, tuk: 0, pye: 0, sandwich: 0 };
        html += "<tr><td><b>" + m.name + "</b></td><td><span style='color:var(--primary); font-weight:bold;'>" + st.total + "회</span></td><td>" + st.tuk + "회</td><td>" + st.pye + "회</td><td>" + st.sandwich + "회</span></td></tr>";
    });
    html += "</tbody></table>";
    document.getElementById("userStatsUI").innerHTML = html;
}
